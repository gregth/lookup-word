<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4677f5"/>
      <stop offset="1" stop-color="#2346b5"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <!-- macOS icon grid: an 824 pt rounded square centred on a 1024 pt canvas -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <!-- a magnifier over "Aa": looking a word up -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round">
    <circle cx="462" cy="462" r="210" stroke-width="44"/>
    <line x1="612" y1="612" x2="760" y2="760" stroke-width="76"/>
  </g>
  <text x="462" y="530" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700"
        font-size="200" fill="#ffffff">Aa</text>
  <rect x="372" y="566" width="180" height="22" rx="11" fill="#7fe0b0"/>
</svg>
